<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e94560">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <title>摆烂导师</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <div id="page-container"></div>
    <nav id="tab-bar">
      <a class="tab-item active" href="#/" data-page="index">
        <span class="tab-icon">📝</span>
        <span class="tab-text">记一笔</span>
      </a>
      <a class="tab-item" href="#/history" data-page="history">
        <span class="tab-icon">📜</span>
        <span class="tab-text">摆烂史</span>
      </a>
      <a class="tab-item" href="#/certificate" data-page="certificate">
        <span class="tab-icon">🏅</span>
        <span class="tab-text">位格</span>
      </a>
      <a class="tab-item" href="#/rank" data-page="rank">
        <span class="tab-icon">🏆</span>
        <span class="tab-text">排行</span>
      </a>
      <a class="tab-item" href="#/qa" data-page="qa">
        <span class="tab-icon">🐟</span>
        <span class="tab-text">问答</span>
      </a>
    </nav>
  </div>

  <div id="toast" class="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-card">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-content" id="modal-content"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="utils/storage.js"></script>
  <script src="utils/ai.js"></script>
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {})
    }
  </script>
</body>
</html>
